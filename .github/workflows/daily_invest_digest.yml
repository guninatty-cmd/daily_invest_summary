name: Daily Invest Digest (통합)

# 하나의 잡이 전부 수행: 사이트 45곳 + 네이버 뉴스 + 유튜브 22채널 + 텔레그램(대화/PDF) + 주가
#  -> 엑셀/후보목록 생성 -> 구글 드라이브 업로드.  노션 업로드는 없음.
# 수집 구간: 어제 00:00 ~ 오늘 00:00 KST (common.py). 이미 성공한 날짜는 다시 실행해도 자동으로 건너뜀(FORCE_RUN=1 로 강제).

on:
  schedule:
    # 새벽 실행 (2026-11-11 변경): GitHub 정기 실행이 3~5시간 늦게 시작하는 일이 잦아, 아침 9시 흐름 전(06시)에 끝나도록 앞당김.
    # UTC 일~금 15:05 = KST 월~토 00:05 (월요일 실행은 토~일 주말 합산). 수집 구간은 '어제' 하루 (common.py).
    - cron: '5 15 * * 0-5'
    # 예비 실행 (KST 02:05): 위 실행이 누락/지연되면 대신 돌며, 이미 성공한 날짜면 자동으로 건너뜀(state/last_run.txt)
    - cron: '5 17 * * 0-5'
  workflow_dispatch:
    inputs:
      force_run:
        description: '이미 성공한 날짜여도 다시 실행 (1 = 예)'
        required: false
        default: '0'
      window_end:
        description: '과거 재수집용 구간 종료 시각 (예: 2026-10-02 08:00, 비우면 자동)'
        required: false
        default: ''

concurrency:
  group: invest-digest
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write   # state/ 및 processed_pdf_hashes.txt 커밋용

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          GAS_WEBHOOK_URL: ${{ secrets.GAS_WEBHOOK_URL }}
          GOOGLE_DRIVE_PARENT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_PARENT_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE_RUN: ${{ github.event.inputs.force_run }}
          WINDOW_END: ${{ github.event.inputs.window_end }}
          # 자막 추출은 클라우드 IP가 차단되는 경우가 많아 기본 꺼짐. PC에서 `python main.py --youtube-only` 로 처리.
          ACTIONS_TRANSCRIPTS: '0'
        run: GEMINI_BUDGET_SEC=120 timeout -s ABRT 3300 python -X faulthandler -u main.py

      - name: Commit state (이미 처리한 항목/PDF 기록)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ processed_pdf_hashes.txt
          git diff --cached --quiet || git commit -m "chore: update state [skip ci]"
          git pull --rebase -q || true
          git push || true
