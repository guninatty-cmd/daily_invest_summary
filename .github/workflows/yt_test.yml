name: YT test
on:
  workflow_dispatch:
jobs:
  gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-genai requests
      - name: Gemini analyze one video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          from youtube_gemini import analyze
          v = [{"video_id": "XoTewrPM5yg", "링크": "https://www.youtube.com/watch?v=XoTewrPM5yg", "후보": "Y", "점수": 5, "길이초": 600, "라이브": False}]
          print(analyze(v))
          print(v[0]["분석상태"])
          print(v[0]["분석"][:1500])
          PY
