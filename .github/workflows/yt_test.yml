name: YT test
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: 길이 확인 진단
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -u - <<'PY'
          import os, re, requests
          ids = ["XoTewrPM5yg", "bYKRJsARXKQ", "hjSiz0Xaohc", "7RFZ9lP0tqg"]
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36", "Accept-Language": "en-US,en;q=0.9"}
          for vid in ids:
              for label, ck in (("plain", {}), ("consent", {"CONSENT": "YES+1", "SOCS": "CAI"})):
                  try:
                      r = requests.get("https://www.youtube.com/watch?v=" + vid, headers=H, cookies=ck, timeout=15)
                      t = r.text
                      print(vid, label, r.status_code, len(t), "len=", re.findall(r'lengthSeconds"\s*:\s*"(\d+)"', t)[:1], "player=", "ytInitialPlayerResponse" in t, "consent=", "consent.youtube" in t or "consent.google" in t, "playab=", re.findall(r'"playabilityStatus":\{"status":"(\w+)"', t)[:1], "live=", re.findall(r'"isLiveContent"\s*:\s*(\w+)', t)[:1])
                  except Exception as e:
                      print(vid, label, "ERR", type(e).__name__, str(e)[:80])
          try:
              from google import genai
              from google.genai import types
              c = genai.Client(api_key=os.environ["GEMINI_API_KEY"])
              for vid in ids[:3]:
                  try:
                      n = c.models.count_tokens(model="gemini-3.8-flash", contents=types.Content(parts=[types.Part(file_data=types.FileData(file_uri="https://www.youtube.com/watch?v=" + vid)), types.Part(text="x")]))
                      print(vid, "count_tokens", n.total_tokens)
                  except Exception as e:
                      print(vid, "count_tokens ERR", type(e).__name__, str(e)[:120])
          except Exception as e:
              print("genai ERR", e)
          PY
